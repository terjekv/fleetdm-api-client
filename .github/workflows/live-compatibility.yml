name: Fleet live compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  live-compatibility:
    name: Fleet ${{ matrix.fleet-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fleet-version:
          - v4.87.0
          - latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Run deterministic live compatibility suite
        env:
          FLEET_COMPAT_VERSIONS: ${{ matrix.fleet-version }}
          FLEET_COMPAT_MODE: smoke
        run: scripts/live-compat-matrix.sh
