name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 5 * * 2"
  workflow_dispatch:
  workflow_call:
    inputs:
      run_semver:
        description: Run the public API compatibility check when a baseline exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust quality tools
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings

      - name: Build documentation
        run: cargo +stable doc --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Check generated Fleet API
        run: scripts/update-spec-api.py --check

      - name: Check release helper syntax
        run: bash -n scripts/check-release.sh scripts/check-release-provenance.sh scripts/release-notes.sh scripts/test-release-provenance.sh

      - name: Test release provenance guard
        run: scripts/test-release-provenance.sh

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test all targets
        run: cargo +stable test --all-targets --locked

      - name: Test documentation
        if: runner.os == 'Linux'
        run: cargo +stable test --doc --locked

  msrv:
    # Keep this check name stable if it becomes a required branch check.
    name: MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check all targets and features
        run: cargo +1.88.0 check --all-targets --all-features --locked

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked --version 0.22.2

      - name: Audit dependencies
        run: cargo +stable audit

      - name: Check licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
          rust-version: 1.88

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Verify publishable package
        run: cargo +stable package --locked

  semver:
    name: Public API Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || inputs.run_semver
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for a published baseline
        id: baseline
        shell: bash
        run: |
          http_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            'https://index.crates.io/fl/ee/fleetdm-api-client')"
          case "$http_code" in
            200) echo "available=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "available=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected crates.io index response: HTTP $http_code" >&2; exit 1 ;;
          esac

      - name: Check SemVer compatibility
        if: steps.baseline.outputs.available == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          feature-group: all-features
